<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next-Gen VR Agency | 3D UI</title>
    
    <!-- 🚀 फ्यूचरिस्टिक फोंट्स (Orbitron for headings, Inter for clean text) -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --neon-pink: #ff0055;
            --dark-bg: #05020a;
            --text-main: #ffffff;
            --text-dim: #8b8b99;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 0, 85, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* सेंटर में हल्का पर्पल ग्लो (Radial Gradient) */
            background-image: radial-gradient(circle at 50% 50%, rgba(50, 10, 60, 0.4) 0%, var(--dark-bg) 60%);
        }

        /* ---------------- 🔝 टॉप नेविगेशन बार (Header) ---------------- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 6%;
            position: relative;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .logo-icon {
            width: 30px;
            height: 30px;
            background: var(--neon-pink);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            box-shadow: 0 0 15px var(--neon-pink);
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dim);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .explore-btn {
            background: transparent;
            color: var(--text-main);
            border: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .explore-btn i { color: var(--neon-pink); transition: 0.3s; }
        .explore-btn:hover i { transform: translateX(5px); }

        /* ---------------- 🌌 विशाल बैकग्राउंड टेक्स्ट ---------------- */
        .huge-bg-text {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 16vw;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.02);
            white-space: nowrap;
            z-index: 1;
            letter-spacing: 10px;
            pointer-events: none;
        }

        /* ---------------- 🚀 मेन हीरो सेक्शन (Center 3D Element) ---------------- */
        .hero-section {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 6%;
            margin-top: -50px;
        }

        .main-3d-image {
            width: 400px;
            height: auto;
            /* तैरने वाला एनिमेशन */
            animation: float 6s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255, 0, 85, 0.3));
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        .main-learn-more {
            position: absolute;
            left: 15%;
            top: 40%;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: var(--text-main);
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
        }

        .main-learn-more:hover {
            border-color: var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
            background: rgba(255, 0, 85, 0.1);
        }

        /* ---------------- 🎴 बॉटम ग्लास कार्ड्स (Neon Borders) ---------------- */
        .cards-container {
            position: absolute;
            bottom: 5%;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 0 6%;
            z-index: 20;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            width: 450px;
            /* निऑन ग्लो इफ़ेक्ट */
            box-shadow: inset 0 0 20px rgba(255, 0, 85, 0.1), 0 10px 30px rgba(0,0,0,0.8);
            transition: 0.4s ease;
        }

        .glass-card:hover {
            border-color: var(--neon-pink);
            box-shadow: inset 0 0 30px rgba(255, 0, 85, 0.2), 0 0 30px rgba(255, 0, 85, 0.4);
            transform: translateY(-5px);
        }

        .card-img-box {
            width: 120px;
            height: 120px;
            background: rgba(0,0,0,0.5);
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-content {
            flex: 1;
        }

        .card-badge {
            background: rgba(255, 0, 85, 0.15);
            color: var(--neon-pink);
            border: 1px solid var(--neon-pink);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 10px;
        }

        .card-content p {
            font-size: 0.8rem;
            color: var(--text-dim);
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .card-btn {
            background: transparent;
            border: 1px solid var(--text-dim);
            color: var(--text-main);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-btn i { font-size: 1rem; }

        .card-btn:hover {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        /* मोबाइल रेस्पोंसिव */
        @media (max-width: 1024px) {
            .cards-container { flex-direction: column; align-items: center; position: relative; bottom: 0; margin-top: 50px; padding-bottom: 50px;}
            .main-learn-more { left: 50%; top: 80%; transform: translateX(-50%); }
            .huge-bg-text { font-size: 25vw; top: 15%; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <!-- 1. विशाल डार्क बैकग्राउंड टेक्स्ट -->
    <div class="huge-bg-text">VR BOXXX</div>

    <!-- 2. टॉप हेडर -->
    <header>
        <div class="logo">
            <div class="logo-icon"></div>
            TRADE MEDIA
        </div>
        
        <nav class="nav-links">
            <a href="#">Services</a>
            <a href="#">Solutions</a>
            <a href="#">Assets</a>
            <a href="#">Agency</a>
        </nav>
        
        <button class="explore-btn">Explore <i class="fas fa-play"></i></button>
    </header>

    <!-- 3. मेन 3D करैक्टर सेक्शन -->
    <main class="hero-section">
        
        <button class="main-learn-more" onclick="sendToWhatsApp('Main Hero')">LEARN MORE</button>
        
        <!-- यहाँ तुम्हारी असली 3D लामा/करैक्टर की PNG आनी चाहिए (अभी डमी 3D रोबोट इमेज है) -->
        <img src="https://images.unsplash.com/photo-1617802690992-15d93263d3a9?auto=format&fit=crop&q=80&w=600" alt="3D Main Avatar" class="main-3d-image" style="border-radius: 20px; box-shadow: 0 0 50px rgba(255,0,85,0.2);">

    </main>

    <!-- 4. बॉटम ग्लास कार्ड्स (निऑन बॉर्डर के साथ) -->
    <div class="cards-container">
        
        <!-- कार्ड 1 (जैसे वीडियो में भालू वाला है) -->
        <div class="glass-card">
            <div class="card-img-box">
                <img src="https://images.unsplash.com/photo-1593508512255-86ab42a8e620?auto=format&fit=crop&q=80&w=200" alt="Avatar 1">
            </div>
            <div class="card-content">
                <div class="card-badge">LEVEL 1 LIGHT</div>
                <p>This package offers sharp visuals and a comfortable fit, perfect for startups, agencies, and virtual setups.</p>
                <button class="card-btn" onclick="sendToWhatsApp('Level 1 Plan')">LEARN MORE <i class="fas fa-arrow-circle-right"></i></button>
            </div>
        </div>

        <!-- कार्ड 2 (जैसे वीडियो में वुल्फ वाला है) -->
        <div class="glass-card">
            <div class="card-img-box">
                <img src="https://images.unsplash.com/photo-1622979135225-d2ba269cf1ac?auto=format&fit=crop&q=80&w=200" alt="Avatar 2">
            </div>
            <div class="card-content">
                <div class="card-badge">PRO 2 LIGHT</div>
                <p>Featuring advanced motion tracking, ultra-high definition graphics and a wide field of view.</p>
                <button class="card-btn" onclick="sendToWhatsApp('Pro Level 2 Plan')">LEARN MORE <i class="fas fa-arrow-circle-right"></i></button>
            </div>
        </div>

    </div>

    <!-- WhatsApp API इंटीग्रेशन (ताकि तुम्हारा लीड जनरेशन चलता रहे) -->
    <script>
        function sendToWhatsApp(planName) {
            // तुम्हारा नंबर
            const phoneNumber = "917877446770"; 
            
            // क्लाइंट के लिए रेडीमेड मैसेज
            const whatsappMessage = `*New 3D Agency Lead!* 🚀\n\nHi Trade Media Team, I visited your advanced website and I am interested in knowing more about: *${planName}*.\n\nPlease share the details!`;

            const encodedMessage = encodeURIComponent(whatsappMessage);
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;

            // बटन दबाते ही सीधा WhatsApp खुलेगा
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
