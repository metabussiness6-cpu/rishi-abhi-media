<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Agency | Ultimate Digital Experience</title>
    
    <!-- एडवांस फोंट्स: बड़े टाइटल्स के लिए Anton और टेक्स्ट के लिए Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Swiper.js CSS (वीडियो जैसे स्मूथ स्लाइडर के लिए) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />

    <style>
        :root {
            --primary: #ff0055;
            --text: #ffffff;
            --bg-dark: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            overflow: hidden; /* स्क्रीन को फिक्स रखने के लिए */
        }

        /* 🌌 डायनामिक बैकग्राउंड इमेजेज */
        .bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1s ease-in-out, transform 5s ease-in-out;
            transform: scale(1.1);
            z-index: 1;
        }
        .bg-layer.active {
            opacity: 0.6; /* हल्का डार्क ताकि टेक्स्ट दिखे */
            transform: scale(1);
        }

        /* ब्लैक ग्रेडिएंट ओवरले */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.8) 100%);
            z-index: 2;
        }

        /* 🏗️ मेन लेआउट (Left Text, Right Slider) */
        .main-container {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 5%;
        }

        /* 📝 लेफ्ट साइड (बड़ा टेक्स्ट) */
        .content-left {
            width: 45%;
            padding-right: 50px;
        }

        .category-tag {
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 14px;
            display: block;
        }

        .huge-title {
            font-family: 'Anton', sans-serif;
            font-size: 6vw;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 0px 10px 30px rgba(0,0,0,0.8);
        }

        .price-tag {
            font-size: 2.5rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 20px;
            background: rgba(255, 0, 85, 0.2);
            display: inline-block;
            padding: 5px 20px;
            border-left: 4px solid var(--primary);
        }

        .description {
            font-size: 1.1rem;
            color: #cccccc;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* 🎴 राइट साइड (Swiper Carousel) */
        .content-right {
            width: 55%;
            height: 60vh;
        }

        .swiper { width: 100%; height: 100%; padding-top: 50px; padding-bottom: 50px; }

        .swiper-slide {
            background-position: center;
            background-size: cover;
            width: 300px;
            height: 400px;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .swiper-slide::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%);
        }

        .slide-content {
            position: absolute;
            bottom: 20px; left: 20px;
            z-index: 2;
        }

        .slide-content h3 { font-family: 'Anton', sans-serif; font-size: 24px; letter-spacing: 1px; }
        .slide-content p { font-size: 14px; color: var(--primary); font-weight: 600; }

        /* 🔘 कॉल टू एक्शन बटन */
        .cta-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(255, 0, 85, 0.4);
        }
        .cta-btn:hover { background: #ff3377; transform: translateY(-5px); }

        /* 💎 ग्लास मोडल (फॉर्म जो बटन दबाने पर खुलेगा) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(15px);
            z-index: 100;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: 0.4s ease;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-box {
            background: rgba(20,20,20,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 50px;
            border-radius: 20px;
            width: 90%; max-width: 500px;
            transform: translateY(50px);
            transition: 0.4s ease;
            position: relative;
        }

        .modal-overlay.active .modal-box { transform: translateY(0); }

        .close-btn {
            position: absolute; top: 20px; right: 20px;
            font-size: 30px; cursor: pointer; color: #fff;
        }

        .modal-box h2 { font-family: 'Anton', sans-serif; font-size: 35px; margin-bottom: 20px; letter-spacing: 1px; }

        .input-field {
            width: 100%; padding: 15px; margin-bottom: 20px;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; border-radius: 5px; font-size: 16px; outline: none;
        }
        .input-field:focus { border-color: var(--primary); }
        
        .whatsapp-btn {
            width: 100%; background: #25D366; color: #fff; border: none;
            padding: 18px; font-size: 18px; font-weight: 600; border-radius: 5px;
            cursor: pointer; transition: 0.3s; display: flex; justify-content: center; gap: 10px;
        }
        .whatsapp-btn:hover { background: #1ebe57; transform: translateY(-3px); }

        /* मोबाइल रेस्पोंसिव */
        @media (max-width: 900px) {
            .main-container { flex-direction: column; justify-content: center; text-align: center; }
            .content-left { width: 100%; padding: 0; margin-top: 50px; }
            .huge-title { font-size: 12vw; }
            .content-right { width: 100%; height: 40vh; }
        }
    </style>
</head>
<body>

    <!-- डायनामिक बैकग्राउंड लेयर्स -->
    <div class="bg-layer active" id="bg-1" style="background-image: url('https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&q=80&w=2000');"></div>
    <div class="bg-layer" id="bg-2" style="background-image: url('https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&q=80&w=2000');"></div>
    <div class="bg-layer" id="bg-3" style="background-image: url('https://images.unsplash.com/photo-1542744173-8e7e53415bb0?auto=format&fit=crop&q=80&w=2000');"></div>
    <div class="overlay"></div>

    <div class="main-container">
        
        <!-- लेफ्ट साइड (टेक्स्ट और प्राइस जो डायनामिकली बदलेगा) -->
        <div class="content-left">
            <span class="category-tag" id="dynamicTag">Starter Pack</span>
            <h1 class="huge-title" id="dynamicTitle">Level 1 Basic</h1>
            <div class="price-tag" id="dynamicPrice">₹4,999</div>
            <p class="description" id="dynamicDesc">1 to 3 Pages Fast Website, Mobile Responsive, and WhatsApp Integration. Perfect for small businesses.</p>
            <button class="cta-btn" onclick="openModal()">Build This Plan</button>
        </div>

        <!-- राइट साइड (Swiper Slider - वीडियो की तरह) -->
        <div class="content-right">
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    <!-- Slide 1 -->
                    <div class="swiper-slide" style="background-image: url('https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&q=80&w=600');">
                        <div class="slide-content">
                            <p>₹4,999</p>
                            <h3>BASIC PLAN</h3>
                        </div>
                    </div>
                    <!-- Slide 2 -->
                    <div class="swiper-slide" style="background-image: url('https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&q=80&w=600');">
                        <div class="slide-content">
                            <p>₹9,999</p>
                            <h3>PREMIUM</h3>
                        </div>
                    </div>
                    <!-- Slide 3 -->
                    <div class="swiper-slide" style="background-image: url('https://images.unsplash.com/photo-1542744173-8e7e53415bb0?auto=format&fit=crop&q=80&w=600');">
                        <div class="slide-content">
                            <p>₹19,999</p>
                            <h3>GROWTH COMBO</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- 💎 द ग्लास मोडल फॉर्म (WhatsApp Integration) -->
    <div class="modal-overlay" id="formModal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2>START PROJECT</h2>
            
            <form id="whatsappForm" onsubmit="sendToWhatsApp(event)">
                <input type="text" id="clientName" class="input-field" placeholder="Full Name / Business Name" required>
                
                <select id="businessCategory" class="input-field" required>
                    <option value="" disabled selected>Select Business Category</option>
                    <option value="Trading/Finance">Trading & Finance</option>
                    <option value="Real Estate">Real Estate</option>
                    <option value="Local Service">Local Service / Clinic</option>
                </select>

                <!-- यह फील्ड स्लाइडर के हिसाब से अपने आप लॉक हो जाएगी -->
                <input type="text" id="selectedPlan" class="input-field" readonly style="color: var(--primary); font-weight: bold;">
                
                <textarea id="extraDetails" class="input-field" placeholder="Any extra requirements? (Optional)" rows="3"></textarea>

                <button type="submit" class="whatsapp-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                    Send to WhatsApp
                </button>
            </form>
        </div>
    </div>

    <!-- Swiper JS Script -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    
    <script>
        // डेटाबेस (हर स्लाइड का कंटेंट यहाँ से बदल रहा है)
        const slideData = [
            { tag: 'Starter Pack', title: 'LEVEL 1 BASIC', price: '₹4,999', desc: '1 to 3 Pages Fast Website, Mobile Responsive, and WhatsApp Integration. Perfect for small businesses.' },
            { tag: 'Most Popular', title: 'PREMIUM PRO', price: '₹9,999', desc: '5 Pages Premium Design, Email Forms, SEO Ready, and Basic UI Animations to stand out.' },
            { tag: 'VIP Delivery', title: 'GROWTH COMBO', price: '₹19,999', desc: 'Full Website + Meta Ads Setup + Advanced Custom Forms. Delivery in 48 Hours flat.' }
        ];

        let currentPlanText = slideData[0].title + " (" + slideData[0].price + ")";

        // Swiper Slider Initialization (CoverFlow Effect)
        var swiper = new Swiper(".mySwiper", {
            effect: "coverflow",
            grabCursor: true,
            centeredSlides: true,
            slidesPerView: "auto",
            coverflowEffect: {
                rotate: 20, stretch: 0, depth: 200, modifier: 1, slideShadows: true,
            },
            on: {
                // जब भी स्लाइड चेंज होगी, ये फंक्शन चलेगा
                slideChange: function () {
                    const index = this.activeIndex;
                    
                    // टेक्स्ट बदलना
                    document.getElementById('dynamicTag').innerText = slideData[index].tag;
                    document.getElementById('dynamicTitle').innerText = slideData[index].title;
                    document.getElementById('dynamicPrice').innerText = slideData[index].price;
                    document.getElementById('dynamicDesc').innerText = slideData[index].desc;
                    
                    // बैकग्राउंड इमेज बदलना
                    document.querySelectorAll('.bg-layer').forEach(layer => layer.classList.remove('active'));
                    document.getElementById('bg-' + (index + 1)).classList.add('active');

                    // फॉर्म के लिए करंट प्लान सेट करना
                    currentPlanText = slideData[index].title + " (" + slideData[index].price + ")";
                }
            }
        });

        // 💎 मोडल फॉर्म लॉजिक
        const modal = document.getElementById('formModal');
        
        function openModal() {
            document.getElementById('selectedPlan').value = "Selected: " + currentPlanText;
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        // 🟢 WhatsApp API लॉजिक (तुम्हारा नंबर +91 7877446770)
        function sendToWhatsApp(e) {
            e.preventDefault();
            
            const btn = document.querySelector('.whatsapp-btn');
            btn.innerHTML = 'Connecting... 🚀';

            const name = document.getElementById('clientName').value;
            const category = document.getElementById('businessCategory').value;
            const details = document.getElementById('extraDetails').value || "None";
            
            // तुम्हारा नंबर
            const phoneNumber = "917877446770"; 

            // WhatsApp मैसेज स्ट्रक्चर
            const whatsappMessage = `*New Agency Lead!* 🚀\n\n*Name:* ${name}\n*Business:* ${category}\n*Plan Selected:* ${currentPlanText}\n*Details:* ${details}\n\nLet's get started!`;

            const encodedMessage = encodeURIComponent(whatsappMessage);
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;

            setTimeout(() => {
                window.open(whatsappUrl, '_blank');
                document.getElementById('whatsappForm').reset();
                closeModal();
                btn.innerHTML = 'Send to WhatsApp';
            }, 800);
        }
    </script>
</body>
</html>
